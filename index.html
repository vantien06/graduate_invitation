<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graduation Invitation</title>
  <style>
    :root { --bg: #fdf8f0; --ink: #2b2b2b; --accent: #b8860b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; padding: 16px; text-align: center;
    }
    .card { max-width: 520px; padding: 48px 32px; border: 2px solid var(--accent); border-radius: 12px; }
    h1 { color: var(--accent); margin: 0 0 12px; font-size: 2rem; }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎓 Graduation Invitation</h1>
    <p>Coming soon — details will be posted here shortly.</p>
  </main>
</body>
</html>
